# Keep a runaway agent build from taking down the rest of the box.
# MemoryHigh throttles + reclaims first; MemoryMax is the hard wall.
#
# Sizing rule (runbook Step 5): High ~55% RAM, Max ~75% RAM,
# CPUQuota ~ (cores x 100) - 20.  This box: 6 vCPU / 12 GB.
#
# NOTE: these bind to LOGIN SESSIONS ONLY. `ssh agent@host` lands in
# user-1001.slice and is capped; `sudo -u agent` lands in user-0.slice
# and is NOT. Drive agents over SSH.
[Slice]
MemoryHigh=6500M
MemoryMax=9G
MemorySwapMax=8G
CPUQuota=580%
CPUWeight=50
IOWeight=50
TasksMax=4096
