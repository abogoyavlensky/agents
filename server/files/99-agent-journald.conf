# journald defaults to 10% of the filesystem - several GB on a long-uptime
# box. SystemMaxUse is the part that matters: vacuuming alone lets it regrow.
#
# This is a drop-in on purpose. The runbook's `sed -i s/^\[Journal\]/.../`
# re-matches its own output: run it twice and you get two SystemMaxUse lines.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
