# Agentic development server provisioning.
#
# Automates Steps 1-12 of sandbox/fresh_server_setup.md. Read that runbook
# first - it explains WHY each of these exists. This file is a table of
# contents; the actual logic lives in files/ so it can be shellcheck'd.
#
#   spot -p spot.yml -i inventory.yml -t agentbox -n survey   # read-only, first
#   spot -p spot.yml -i inventory.yml -t agentbox             # tasks 1-9
#   ssh agent@box ./setup-gh-auth.sh                          # MANUAL (token)
#   spot -p spot.yml -i inventory.yml -t agentbox -n skills
#   spot -p spot.yml -i inventory.yml -t agentbox -n verify
#
# Target: fresh Ubuntu 24.04, 6 vCPU / 12 GB. Connects as root.

user: root
ssh_key: /root/.ssh/id_ed25519_spot

tasks:
  # ---------------------------------------------------------------- survey --
  - name: survey
    commands:
      - name: "read-only audit - run this BEFORE anything else"
        options: {no_auto: true}
        script: |
          echo "== os =="; . /etc/os-release; echo "  $PRETTY_NAME"
          echo "== capacity =="
          echo "  cores=$(nproc)  ram=$(free -g | awk '/Mem:/{print $2}')G  swap=$(free -g | awk '/Swap:/{print $2}')G"
          df -h / | tail -1 | sed 's/^/  /'
          echo "== journal =="; journalctl --disk-usage | sed 's/^/  /'
          echo "== existing users (uid>=1000) =="
          awk -F: '$3>=1000 && $3<65534 {print "  "$1" "$3" "$6}' /etc/passwd
          echo "== privileged groups =="; getent group sudo docker | sed 's/^/  /'
          echo "== running containers =="; (docker ps 2>/dev/null || echo "  no docker") | sed 's/^/  /'
          echo "== secrets exposed in argv =="
          ps -eo user,args | grep -iE 'token|bearer|api[-_]?key' | grep -v grep | sed 's/^/  /' || echo "  none"

  # -------------------------------------------------------------- packages --
  - name: packages
    commands:
      - name: "refuse to run on anything but 24.04 (files/docker.list pins noble)"
        script: |
          . /etc/os-release
          [ "$VERSION_ID" = "24.04" ] || { echo "FATAL: expected Ubuntu 24.04, got $VERSION_ID"; exit 1; }

      # NEEDRESTART_MODE=a is not optional: Ubuntu 24.04's needrestart opens a
      # whiptail service-restart prompt that hangs a TTY-less run indefinitely.
      - name: "apt baseline"
        script: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          apt-get update
          apt-get install -y \
            git curl wget ca-certificates build-essential pkg-config \
            tmux ripgrep jq fzf unzip zip bzip2 file procps \
            openssh-client gnupg gpg-agent iproute2 \
            libssl-dev zlib1g-dev

  # ---------------------------------------------------------------- docker --
  - name: docker
    commands:
      - name: "docker apt repo + engine"
        script: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        cond: "! command -v docker"

      # HARD GATE. Docker group membership is root-equivalent
      # (docker run -v /:/host) and would silently void the entire boundary.
      - name: "assert agent is NOT in the docker group"
        script: |
          if id agent >/dev/null 2>&1; then
            if id -nG agent | tr ' ' '\n' | grep -qx docker; then
              echo "FATAL: agent is in the docker group - that is root-equivalent."
              exit 1
            fi
          fi
          echo "ok: docker group = [$(getent group docker | cut -d: -f4)]"

  # -------------------------------------------------------------- journald --
  - name: journald
    commands:
      # A drop-in, NOT the runbook's `sed -i s/^\[Journal\]/.../`. That sed
      # re-matches its own output: run it twice and journald.conf ends up with
      # two SystemMaxUse lines under one header. Verified.
      - name: "cap journald via drop-in"
        copy:
          src: files/99-agent-journald.conf
          dst: /etc/systemd/journald.conf.d/99-agent.conf
          mkdir: true

      - name: "vacuum + restart only while the journal is still oversized"
        script: |
          systemctl restart systemd-journald
          journalctl --vacuum-size=200M
          journalctl --disk-usage
        cond: "journalctl --disk-usage | grep -qE '[0-9.]+G|[0-9.]+T'"

  # ------------------------------------------------------------------ swap --
  - name: swap
    commands:
      # The one step where a blind re-run does real damage: fallocate over a
      # LIVE swapfile corrupts it.
      - name: "create swapfile"
        script: |
          set -eu
          fallocate -l 8G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
        cond: "! test -e /swapfile"

      - name: "swapon an existing-but-inactive swapfile (post-reboot / partial run)"
        script: swapon /swapfile
        cond: "test -e /swapfile && ! swapon --noheadings --show=NAME | grep -qx /swapfile"

      # match= already finds it, so append never duplicates.
      - name: "persist across reboots"
        line:
          file: /etc/fstab
          match: '^/swapfile\s'
          append: "/swapfile none swap sw 0 0"

      - name: "vm tunables"
        copy: {src: files/99-agent-vm.conf, dst: /etc/sysctl.d/99-agent-vm.conf}

      - name: "apply vm tunables"
        script: sysctl -q -p /etc/sysctl.d/99-agent-vm.conf

  # ------------------------------------------------------------ agent-user --
  - name: agent-user
    commands:
      - name: "create agent (uid pinned to 1001 - the slice drop-in path is uid-derived)"
        script: useradd -m -u 1001 -s /bin/bash -c "Agent development user" agent
        cond: "! id agent"

      - name: "assert uid, then lock down the home dir"
        script: |
          set -eu
          uid=$(id -u agent)
          [ "$uid" = "1001" ] || {
            echo "FATAL: agent uid=$uid but files land in user-1001.slice.d."
            echo "Recreate agent with -u 1001, or update dst paths in spot.yml."
            exit 1; }
          chmod 700 /home/agent                       # Ubuntu HOME_MODE is 0750
          install -d -m 755 -o agent -g agent /home/agent/Projects

      - name: "assert no sudo/docker privileges"
        script: |
          for g in sudo docker; do
            if id -nG agent | tr ' ' '\n' | grep -qx "$g"; then
              echo "FATAL: agent is in group $g"; exit 1
            fi
          done
          echo "ok: agent groups = $(id -nG agent)"

      - name: "SSH access with the same keys as root"
        script: |
          set -eu
          install -d -m 700 -o agent -g agent /home/agent/.ssh
          install -m 600 -o agent -g agent /root/.ssh/authorized_keys /home/agent/.ssh/authorized_keys

  # ---------------------------------------------------------------- limits --
  - name: limits
    commands:
      - name: "cgroup caps for the agent login slice"
        copy:
          src: files/50-agent-limits.conf
          dst: /etc/systemd/system/user-1001.slice.d/50-agent-limits.conf
          mkdir: true

      - name: "reload systemd"
        script: systemctl daemon-reload

      - name: "linger so the user manager and tmux survive logout"
        script: loginctl enable-linger agent
        cond: 'test "$(loginctl show-user agent -p Linger --value 2>/dev/null)" != "yes"'

  # ----------------------------------------------------------- agent-files --
  - name: agent-files
    commands:
      - name: "managed interactive env + git aliases"
        copy: {src: files/bashrc.agent, dst: /home/agent/.bashrc.agent}

      - name: "login-shell PATH (adds the mise shims dir that ~/.profile omits)"
        copy: {src: files/bash_profile, dst: /home/agent/.bash_profile}

      - name: "mise tool declaration"
        copy:
          src: files/mise-config.toml
          dst: /home/agent/.config/mise/config.toml
          mkdir: true

      # spot's copy cannot set owner/group/mode. House rule: every copy whose
      # dst is under /home/agent gets a paired chown immediately after.
      - name: "chown everything copied into /home/agent"
        script: |
          set -eu
          chown agent:agent /home/agent/.bashrc.agent /home/agent/.bash_profile
          chmod 644 /home/agent/.bashrc.agent /home/agent/.bash_profile
          chown -R agent:agent /home/agent/.config

      - name: "hook the managed block into the stock .bashrc"
        line:
          file: /home/agent/.bashrc
          match: '\.bashrc\.agent'
          append: '[ -f "$HOME/.bashrc.agent" ] && . "$HOME/.bashrc.agent"'

      - name: "restore .bashrc ownership (the line edit above ran as root)"
        script: chown agent:agent /home/agent/.bashrc

      - name: "gh auth helper"
        copy: {src: files/setup-gh-auth.sh, dst: /home/agent/setup-gh-auth.sh}

      # Deliberately NOT chowned to agent: the agent may EXECUTE this script
      # but must not be able to EDIT the thing a human types a token into.
      - name: "assert gh helper is root-owned 0755"
        script: |
          chown root:root /home/agent/setup-gh-auth.sh
          chmod 755 /home/agent/setup-gh-auth.sh

      # Root-owned, outside /home/agent, so root never executes agent-writable
      # code (Operating rule 1). They are only ever run via sudo -u agent.
      - name: "agent-side setup scripts"
        copy:
          src: files/agent/
          dst: /usr/local/lib/agent-setup/
          mkdir: true
          chmod+x: true

      - name: "assert setup scripts are root-owned"
        script: chown -R root:root /usr/local/lib/agent-setup

  # ------------------------------------------------------------- toolchain --
  - name: toolchain
    commands:
      - name: "mise + everything declared in config.toml"
        script: sudo -u agent -H /usr/local/lib/agent-setup/10-mise.sh

      - name: "Claude Code"
        script: sudo -u agent -H /usr/local/lib/agent-setup/20-claude.sh
        cond: "! test -x /home/agent/.local/bin/claude"

      - name: "Codex (+ mise reshim, without which the shim never appears)"
        script: sudo -u agent -H /usr/local/lib/agent-setup/30-codex.sh
        cond: "! test -x /home/agent/.local/share/mise/shims/codex"

  # ------------------------------------------------------------ git-config --
  - name: git-config
    commands:
      - name: "git identity, insteadOf rewrites, agent-usable git aliases"
        script: sudo -u agent -H /usr/local/lib/agent-setup/40-git.sh

  # ---------------------------------------------------------------- verify --
  - name: verify
    commands:
      - name: "boundary, limits, toolchain, and idempotency counters"
        script: |
          set -u
          fail=0
          chk() { if eval "$2"; then echo "  ok   $1"; else echo "  FAIL $1"; fail=$((fail+1)); fi; }

          echo "== identity =="
          chk "agent uid is 1001"         '[ "$(id -u agent)" = 1001 ]'
          chk "agent NOT in docker"       '! id -nG agent | tr " " "\n" | grep -qx docker'
          chk "agent NOT in sudo"         '! id -nG agent | tr " " "\n" | grep -qx sudo'
          chk "home is 0700"              '[ "$(stat -c %a /home/agent)" = 700 ]'

          echo "== boundary (each MUST be denied) =="
          chk "no sudo"                   '! sudo -u agent -H sudo -n true 2>/dev/null'
          chk "cannot read root ssh"      '! sudo -u agent -H cat /root/.ssh/authorized_keys 2>/dev/null'
          chk "no docker socket"          '! sudo -u agent -H docker ps >/dev/null 2>&1'
          chk "no setuid under home"      '[ -z "$(find /home/agent -perm -4000 -o -perm -2000 2>/dev/null)" ]'

          echo "== limits live =="
          chk "MemoryMax=9G"              '[ "$(systemctl show user-1001.slice -p MemoryMax --value)" = 9663676416 ]'
          chk "MemoryHigh set"            '[ "$(systemctl show user-1001.slice -p MemoryHigh --value)" != infinity ]'
          chk "CPUQuota set"              '[ "$(systemctl show user-1001.slice -p CPUQuotaPerSecUSec --value)" != infinity ]'
          chk "linger on"                 '[ "$(loginctl show-user agent -p Linger --value)" = yes ]'
          chk "swap active"               'swapon --noheadings --show=NAME | grep -qx /swapfile'
          chk "swappiness=10"             '[ "$(sysctl -n vm.swappiness)" = 10 ]'
          chk "journal capped"            'grep -qx SystemMaxUse=200M /etc/systemd/journald.conf.d/99-agent.conf'

          echo "== toolchain reachable as agent =="
          for t in node npm gh codex revdiff opencode spot skl; do
            chk "$t shim" "test -x /home/agent/.local/share/mise/shims/$t"
          done
          chk "claude binary" 'test -x /home/agent/.local/bin/claude'

          echo "== IDEMPOTENCY COUNTERS (what a second run would break) =="
          chk "one swap fstab entry"      '[ "$(grep -c "^/swapfile[[:space:]]" /etc/fstab)" = 1 ]'
          chk "one SystemMaxUse"          '[ "$(grep -c "^SystemMaxUse=" /etc/systemd/journald.conf.d/99-agent.conf)" = 1 ]'
          chk "one bashrc hook"           '[ "$(grep -c "\.bashrc\.agent" /home/agent/.bashrc)" = 1 ]'
          chk "exactly 2 insteadOf"       '[ "$(sudo -u agent -H git config --global --get-all url."https://github.com/".insteadOf | wc -l)" = 2 ]'
          chk ".bashrc owned by agent"    '[ "$(stat -c %U /home/agent/.bashrc)" = agent ]'
          chk "gh helper root-owned 755"  '[ "$(stat -c "%U %a" /home/agent/setup-gh-auth.sh)" = "root 755" ]'

          echo
          [ "$fail" -eq 0 ] && { echo "ALL CHECKS PASSED"; exit 0; }
          echo "$fail CHECK(S) FAILED"; exit 1

      - name: "agent tools run unprivileged in the right slice"
        script: |
          systemd-run --uid=agent --gid=agent --slice=user-1001.slice --scope --quiet \
            bash -c 'echo "  user=$(id -un) euid=$EUID"; grep -o "user-1001.slice" /proc/self/cgroup | head -1'

  # ------------------------------------------------- manual / opt-in tasks --
  - name: skills
    commands:
      - name: "clone the agents repo and link skills (needs gh auth first)"
        options: {no_auto: true}
        script: sudo -u agent -H /usr/local/lib/agent-setup/50-skills.sh

  - name: bwrap-apparmor
    commands:
      # Only worth running if you intend codex to run SANDBOXED here. If your
      # other environments (Lima) cannot sandbox, the skills must keep
      # --dangerously-bypass-approvals-and-sandbox and this buys nothing.
      - name: "install bubblewrap (gives a stable /usr/bin/bwrap path)"
        options: {no_auto: true}
        script: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          apt-get install -y bubblewrap

      - name: "apparmor profile exempting bwrap from the userns hardening"
        options: {no_auto: true}
        copy: {src: files/apparmor-bwrap, dst: /etc/apparmor.d/bwrap}

      - name: "load the profile and prove bwrap works"
        options: {no_auto: true}
        script: |
          set -eu
          apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-all /bin/true && echo "bwrap OK"

  - name: verify-github
    commands:
      - name: "token ceiling - all of these MUST be blocked (needs gh auth)"
        options: {no_auto: true}
        script: |
          set -u
          R="${GH_TEST_REPO:-abogoyavlensky/scratch-notes}"
          for ep in "/repos/$R/actions/secrets" "/repos/$R/keys" "/repos/$R/hooks" "/user/emails"; do
            if sudo -u agent -H bash -lc "gh api $ep" >/dev/null 2>&1; then
              echo "  FAIL $ep is ACCESSIBLE - token is too broad"
            else
              echo "  ok   $ep blocked"
            fi
          done
