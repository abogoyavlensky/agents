# Release pipeline for gizmo.
#
# Triggered by pushing a version tag (vX.Y.Z). It:
#   1. reuses the existing checks workflow so only green code is released,
#   2. cross-compiles binaries for macOS and Linux on amd64 and arm64,
#   3. publishes a GitHub Release with the archives and a checksums file,
#   4. updates the Homebrew tap (acme/homebrew-tap) so users can run
#      `brew install acme/tap/gizmo`.
#
# NOTE: the separate .github/workflows/checks.yml is reused here, never
# duplicated.
name: release

on:
  push:
    tags:
      - "v*"

# Needed to create the GitHub Release in this repo. The Homebrew tap lives in a
# different repo and is pushed to with a dedicated token (HOMEBREW_TAP_TOKEN).
permissions:
  contents: write

jobs:
  # Reuse the checks workflow the project already has (it exposes workflow_call).
  check:
    uses: ./.github/workflows/checks.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch dependencies
        run: lgx install

      - name: Download let-go base for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Single source of truth for the let-go version: .mise.toml.
          lg_version="$(grep -E '^\s*lg\s*=' .mise.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "let-go version: ${lg_version}"
          asset="let-go_${lg_version}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          base_url="https://github.com/nooga/let-go/releases/download"
          mkdir -p base
          # Try the tag with and without a leading "v" to be robust to either
          # release-tag convention.
          curl -fsSL "${base_url}/v${lg_version}/${asset}" -o base/let-go.tar.gz \
            || curl -fsSL "${base_url}/${lg_version}/${asset}" -o base/let-go.tar.gz
          tar -xzf base/let-go.tar.gz -C base
          lg_base="$(find base -type f \( -name lg -o -name let-go \) | head -n1)"
          test -n "${lg_base}"
          chmod +x "${lg_base}"
          echo "LG_BASE=${lg_base}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.os }}/${{ matrix.arch }} binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Stamp the release version into the CLI before compiling.
          sed -i -E "s/:version \"[^\"]*\"/:version \"${VERSION}\"/" main.lg
          # Cross-compile by bundling the target-platform let-go base.
          lgx build -bundle-base "${LG_BASE}"
          test -f bin/gizmo

      - name: Package archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="gizmo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist
          cp bin/gizmo gizmo
          tar -czf "dist/${name}.tar.gz" gizmo
          rm gizmo

      - uses: actions/upload-artifact@v4
        with:
          name: gizmo-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect archives and compute checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          (cd dist && sha256sum gizmo_*.tar.gz | tee checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/gizmo_*.tar.gz dist/checksums.txt

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: acme/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render formula and push to tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha() { awk -v f="$1" '$2 == f { print $1 }' dist/checksums.txt; }
          export VERSION
          export SHA_DARWIN_AMD64="$(sha "gizmo_${VERSION}_darwin_amd64.tar.gz")"
          export SHA_DARWIN_ARM64="$(sha "gizmo_${VERSION}_darwin_arm64.tar.gz")"
          export SHA_LINUX_AMD64="$(sha "gizmo_${VERSION}_linux_amd64.tar.gz")"
          export SHA_LINUX_ARM64="$(sha "gizmo_${VERSION}_linux_arm64.tar.gz")"

          mkdir -p homebrew-tap/Formula
          bash .github/scripts/render-formula.sh > homebrew-tap/Formula/gizmo.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gizmo.rb
          git commit -m "gizmo ${VERSION}"
          git push
