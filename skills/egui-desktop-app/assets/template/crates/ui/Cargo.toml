[package]
name = "myapp-ui"
description = "The egui front end: panels, theme, control handling. Thin: reads core state, acts through commands."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
myapp-core = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Headless UI tests: AccessKit queries, simulated input, and (with `wgpu`) pixel snapshots.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
