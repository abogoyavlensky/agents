[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
myapp-core = { path = "crates/core" }
myapp-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# UI: keep all egui-family crates on the same minor version, always bumped together.
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Shipped code never panics: a crash loses the user's unsaved work. Tests may (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"

[profile.dev.package."*"]
# Dependencies optimized even in debug: egui apps and pixel tests stay fast while iterating.
opt-level = 2

[profile.release]
lto = "thin"
